name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install iOS Simulator Runtime
        run: xcrun simctl runtime add "com.apple.CoreSimulator.SimRuntime.iOS-18-2"

      - name: Build and Test
        run: |
          xcodebuild test \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.2" \
            -resultBundlePath TestResults

      - name: Build Release
        run: |
          xcodebuild build \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -configuration Release \
            -destination "generic/platform=iOS Simulator"
