name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # Xcode 27 image (its default Xcode is 27.x, so no xcode-select pin).
    # If this preview image proves flaky, fall back to macos-26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Build and Test
        run: |
          xcodebuild test \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 17" \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
