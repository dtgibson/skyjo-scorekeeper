name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild test \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
