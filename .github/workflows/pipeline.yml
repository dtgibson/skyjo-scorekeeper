name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # Xcode 27 image. If this preview image proves flaky, fall back to macos-26.
    runs-on: xcode-27
    env:
      # The app ships on Xcode 27.1 (iPhone Duo's ReservedRegion API is 27.1-only),
      # but this image still defaults to 27.0. Select 27.1 for this job only;
      # delete this once the xcode-27 image's default Xcode is 27.1 or later.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Build and Test
        run: |
          xcodebuild test \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 17" \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project SkyjoScorekeeper/SkyjoScorekeeper.xcodeproj \
            -scheme SkyjoScorekeeper \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
